name: level-zero-raytracing-tests
base: core24
confinement: strict
lint:
  ignore:
    - metadata
platforms:
  amd64:
    build-on: [amd64]
version: '2024-06-10'
summary: Intel Level Zero Raytracing Tests
license: MIT

description: |
  Snap for building and running Intel's Level Zero Raytracing tests
  from the level-zero-raytracing-support repository. Requires Intel
  GPU hardware with ray tracing support (Xe HPG or later).

apps:
  test:
    command: test
    plugs:
      - opengl
      - hardware-observe
      - system-observe
  list-tests:
    command: list_tests
    plugs:
      - opengl
      - hardware-observe
      - system-observe

package-repositories:
  - type: apt
    ppa: kobuk-team/intel-graphics-staging

parts:
  test-runner:
    source: bin/
    plugin: dump
    stage:
      - test

  list-tests-runner:
    source: bin/
    plugin: dump
    stage:
      - list_tests

  level-zero-raytracing-tests:
    plugin: nil
    source: https://github.com/intel/level-zero-raytracing-support.git
    source-type: git
    build-attributes:
      - enable-patchelf
    build-packages:
      - build-essential
      - binutils
      - cmake
      - ninja-build
      - clang
      - pkg-config
      - git
      - wget
      - libze-dev
      - libze-intel-gpu-dev
      - libpng-dev
      - libboost-all-dev
      - libvulkan-dev
      - libgl-dev
      - mesa-common-dev
      - libglfw3-dev
      - libgles2-mesa-dev
      - glslang-tools
      - ocl-icd-opencl-dev
      - ocl-icd-libopencl1
      - libva-dev
      - meson
      - python3-pip
    stage-packages:
      - libze1
      - libze-intel-gpu1
      - libze-intel-gpu-raytracing
      - libpng16-16
      - libboost-log1.83.0
      - libboost-program-options1.83.0
      - libboost-filesystem1.83.0
      - libboost-system1.83.0
      - libvulkan1
      - libgl1
      - libglfw3
      - libdrm2
      - ocl-icd-libopencl1
      - libva2
      - libva-drm2
      - libstdc++6
    override-build: |
      set -eux

      # Download and set up the SYCL/clang toolkit (matches nightly used by install script)
      SYCL_BUNDLE_ROOT="${CRAFT_PART_BUILD}/sycl_linux"
      mkdir -p "${SYCL_BUNDLE_ROOT}"
      cd "${SYCL_BUNDLE_ROOT}"
      wget https://github.com/intel/llvm/releases/download/nightly-2024-06-10/sycl_linux.tar.gz
      tar xf sycl_linux.tar.gz
      rm sycl_linux.tar.gz

      export PATH="${SYCL_BUNDLE_ROOT}/bin:${PATH}"
      export CPATH="${SYCL_BUNDLE_ROOT}/include${CPATH:+:${CPATH}}"
      export LIBRARY_PATH="${SYCL_BUNDLE_ROOT}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}"
      export LD_LIBRARY_PATH="${SYCL_BUNDLE_ROOT}/lib:${SYCL_BUNDLE_ROOT}/linux/lib/x64:${SYCL_BUNDLE_ROOT}/lib/oclgpu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

      # Python packages used by some test utilities
      pip3 install opencv-python lxml --break-system-packages

      # Build
      cd "${CRAFT_PART_SRC}"
      mkdir -p build
      cd build
      cmake -G Ninja \
        -D CMAKE_CXX_COMPILER=clang++ \
        -D CMAKE_C_COMPILER=clang \
        -D CMAKE_BUILD_TYPE=Release \
        -D ZE_RAYTRACING_SYCL_TESTS=INTERNAL_RTAS_BUILDER \
        ..
      cmake --build . --target package

      # Copy test executables to the snap's bin dir
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin"
      find "${CRAFT_PART_SRC}/build" -type f -perm -111 \
        -name "embree_*" \
        -exec cp -a {} "${CRAFT_PART_INSTALL}/usr/bin/" \;

      # Bundle SYCL runtime libs from the sycl bundle
      mkdir -p "${CRAFT_PART_INSTALL}/usr/lib"
      find "${SYCL_BUNDLE_ROOT}/lib" -maxdepth 1 -name "libsycl.so*" \
        -exec cp -P {} "${CRAFT_PART_INSTALL}/usr/lib/" \;
