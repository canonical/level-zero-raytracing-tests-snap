name: level-zero-raytracing-tests
base: core26
confinement: strict
lint:
  ignore:
    - metadata
platforms:
  amd64:
    build-on: [amd64]
version: '1.2.3'
summary: Intel Level Zero Raytracing Tests
license: MIT

description: |
  Snap for building and running Intel's Level Zero Raytracing tests
  from the level-zero-raytracing-support repository. Requires Intel
  GPU hardware with ray tracing support (Xe HPG or later).

plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604

apps:
  test:
    command: test
    plugs:
      - opengl
      - gpu-2604
  list-tests:
    command: list_tests

parts:
  test-runner:
    source: bin/
    plugin: dump
    stage:
      - test

  list-tests-runner:
    source: bin/
    plugin: dump
    stage:
      - list_tests

  level-zero-raytracing-tests:
    plugin: nil
    source: https://github.com/intel/level-zero-raytracing-support.git
    source-type: git
    source-tag: 'v1.2.3'
    build-attributes:
      - enable-patchelf
    build-packages:
      - build-essential
      - libstdc++-16-dev
      - binutils
      - cmake
      - ninja-build
      - dpclang-6
      - sycl-dpcpp-6-dev
      - libclang-dpcpp-6-dev
      - llvm-dpcpp-6
      - pkg-config
      - git
      - libze-dev
      - libze-intel-gpu-dev
      - libumf-dev
      - libpng-dev
      - libboost-all-dev
      - libtbb-dev
      - libvulkan-dev
      - libgl-dev
      - mesa-common-dev
      - libglfw3-dev
      - libgles2-mesa-dev
      - glslang-tools
      - ocl-icd-opencl-dev
      - ocl-icd-libopencl1
      - libva-dev
      - meson
    stage-packages:
      - libze1
      - libze-intel-gpu1
      - libze-intel-gpu-raytracing
      - libigc2
      - libigdfcl2
      - libtbb12
      - libpng16-16
      - libboost-log1.90.0
      - libboost-program-options1.90.0
      - libboost-filesystem1.90.0
      - libvulkan1
      - libgl1
      - libglfw3
      - libdrm2
      - ocl-icd-libopencl1
      - libva2
      - libva-drm2
      - libstdc++6
      - libsycl8
      - dpclang-sycl-runtime-libs-6
      - unified-runtime-adapters-dpcpp-6
      - libumf0
    override-build: |
      set -eux

      # Build with Ubuntu's packaged Intel DPC++ compiler (dpclang-6, 6.2.0).
      #
      # dpclang doesn't pick up the system libc multiarch include dir on its
      # own, so libstdc++-16's <cstdlib> can't find <stdlib.h>. Pass the libc
      # and gcc/g++ include dirs explicitly via compiler flags (CPATH alone
      # doesn't propagate to every SYCL sub-compilation).
      GCC_VER=$(ls /usr/include/c++/ | sort -V | tail -1)
      SYS_INCLUDES="-isystem /usr/include/c++/${GCC_VER} -isystem /usr/include/x86_64-linux-gnu/c++/${GCC_VER} -isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"

      cd "${CRAFT_PART_SRC}"
      rm -rf build
      mkdir -p build
      cd build
      cmake -G Ninja \
        -D CMAKE_CXX_COMPILER=dpclang++ \
        -D CMAKE_C_COMPILER=dpclang \
        -D CMAKE_C_FLAGS="--gcc-toolchain=/usr ${SYS_INCLUDES}" \
        -D CMAKE_CXX_FLAGS="--gcc-toolchain=/usr ${SYS_INCLUDES}" \
        -D CMAKE_BUILD_TYPE=Release \
        -D ZE_RAYTRACING_SYCL_TESTS=INTERNAL_RTAS_BUILDER \
        -D ZE_RAYTRACING_TBB=normal \
        -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
        ..
      cmake --build .

      # Copy test executables to the snap's bin dir
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin"
      find "${CRAFT_PART_SRC}/build" -type f -perm -111 \
        -name "embree_*" \
        -exec cp -a {} "${CRAFT_PART_INSTALL}/usr/bin/" \;
